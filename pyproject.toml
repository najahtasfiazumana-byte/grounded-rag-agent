[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-rag-agent"
version = "0.1.0"
description = "RAG agent that cites its sources, checks every sentence against them, flags low confidence and falls back to live web search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Najah Tasfia Zumana" }]
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "ddgs>=9.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
ui = ["streamlit>=1.50", "pandas>=2.0", "altair>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
rag-agent = "grounded_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
